<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://hosting.photobucket.com/bbcfb0d4-be20-44a0-94dc-65bff8947cf2/ff4a3384-baa9-4bc2-94c9-6bff4e3d3ea0.png"
      type="image/x-icon"
    />
    <title>Clark County Vehicle Collisions Heatmap - Bret Bernhoft</title>
    <meta
      name="description"
      content="View traffic collision records in Clark County, WA as an interactive web-based heatmap."
    />
    <meta name="author" content="Bret Bernhoft" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="map"></div>

    <div class="panel">
      <h1>Clark County Vehicle Collisions Heatmap v2.0</h1>

      <div class="row" style="margin-top: 10px">
        <label for="radius">Radius</label>
        <input id="radius" type="range" min="5" max="50" value="20" />
        <span id="radiusVal" class="pill">20</span>
      </div>

      <div class="row">
        <label for="blur">Blur</label>
        <input id="blur" type="range" min="5" max="60" value="25" />
        <span id="blurVal" class="pill">25</span>
      </div>

      <div class="row">
        <button id="fit" class="btn">Fit Onscreen</button>
        <button id="toggle" class="btn" style="background: #444">
          Toggle Heat
        </button>
      </div>

      <div id="stats" class="stats"></div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script src="main.js"></script>
  </body>
</html>
